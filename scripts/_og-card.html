<!doctype html>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@400;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1200px; height: 630px;
    font-family: 'Inter', system-ui, sans-serif;
    background: #22457B;
    position: relative;
    overflow: hidden;
  }

  /* Мягкое свечение сверху слева — чтобы плашка не выглядела плоской заливкой */
  .glow {
    position: absolute; inset: -200px auto auto -200px;
    width: 900px; height: 900px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.14) 0%, rgba(255,255,255,0) 65%);
  }

  .card {
    position: absolute; inset: 28px;
    border: 2px solid rgba(255,255,255,0.22);
    border-radius: 28px;
  }

  .inner {
    position: absolute; inset: 28px;
    padding: 54px 68px 58px;
    display: flex; flex-direction: column; justify-content: space-between;
  }

  .org {
    display: flex; align-items: center; gap: 16px;
    font-size: 25px; font-weight: 600; letter-spacing: 0.02em;
    color: rgba(255,255,255,0.9);
  }
  .org .mark {
    width: 62px; height: 62px; border-radius: 16px;
    object-fit: cover;
    background: #fff;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: 82px; line-height: 1.06; font-weight: 600;
    color: #fff; letter-spacing: -0.01em;
  }
  h1 .accent { color: #F2C4CB; }

  p.sub {
    margin-top: 26px;
    font-size: 31px; line-height: 1.4; font-weight: 400;
    color: rgba(255,255,255,0.82);
    max-width: 880px;
  }

  .foot {
    display: flex; align-items: center; justify-content: space-between;
  }
  .chips { display: flex; gap: 14px; }
  .chip {
    padding: 13px 24px; border-radius: 999px;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.2);
    font-size: 24px; font-weight: 600; color: #fff;
  }
  .addr { font-size: 26px; font-weight: 700; color: rgba(255,255,255,0.72); }
</style>
